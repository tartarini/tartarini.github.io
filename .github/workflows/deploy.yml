name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build JupyterLite (in-browser notebooks)
        run: jupyter lite build --contents notebooks --output-dir _site/lab
      - name: Copy website
        run: |
          cp index.html _site/
          cp -r assets notebooks _site/
          touch _site/.nojekyll
      - name: Fetch profile photo from Google Scholar (unless assets/photo.jpg exists)
        if: hashFiles('assets/photo.jpg') == ''
        continue-on-error: true   # never block a deploy over the photo
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          PHOTO=$(curl -fsSL -A "$UA" "https://scholar.google.com/citations?user=j432ndQAAAAJ&hl=en" \
            | grep -o 'id="gsc_prf_pup-img"[^>]*' | grep -o 'src="[^"]*"' | head -1 | sed 's/^src="//; s/"$//; s/&amp;/\&/g')
          echo "Photo URL: $PHOTO"
          case "$PHOTO" in /*) PHOTO="https://scholar.google.com$PHOTO" ;; esac
          PHOTO="${PHOTO/view_op=view_photo/view_op=medium_photo}"
          if curl -fsSL -A "$UA" -o _site/assets/photo.jpg "$PHOTO" && file _site/assets/photo.jpg | grep -qiE 'image|JPEG|PNG'; then
            echo "::notice::Profile photo downloaded from Google Scholar"
          else
            rm -f _site/assets/photo.jpg
            echo "::warning::Could not download the Google Scholar photo (initials shown instead). Add assets/photo.jpg to the repository to set it manually."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
